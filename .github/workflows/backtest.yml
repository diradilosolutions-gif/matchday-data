name: Back-test models
on:
  schedule:
    # Runs once at the end of the tracking freeze: 17 December, 05:17 SAST (03:17 UTC).
    # GitHub repeats this every year on 17 Dec. To change the date, edit the "17 12" part (day month).
    - cron: "17 3 17 12 *"
  workflow_dispatch:           # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: data-update           # never runs at the same time as "Update data and picks"
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download past seasons (football-data.co.uk, free)
        run: |
          mkdir -p hist
          for s in 2223 2324 2425 2526 2627; do
            for c in E0 E1 SP1 I1 D1 F1 N1 P1; do
              curl -sfL "https://www.football-data.co.uk/mmz4281/$s/$c.csv" -o "hist/${c}_$s.csv" || rm -f "hist/${c}_$s.csv"
            done
          done
          curl -sfL "https://www.football-data.co.uk/new/BRA.csv" -o hist/BRA_all.csv || rm -f hist/BRA_all.csv
          ls -la hist
      - name: Compare old and new model, pick the better one
        run: python scripts/compare_models.py hist
      - name: Test which upset signals really work (for the Upset Pick of the Day)
        run: python scripts/upset_backtest.py hist
      - name: Re-calculate predictions with the chosen model
        run: |
          if [ -f data/matches.json ]; then python scripts/make_predictions.py && python scripts/pick_of_day.py; fi
      - name: Save results
        run: |
          git config user.name "matchday-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in model_choice.json backtest_report.md predictions.json predictions_archive.json upset_rules.json potd.json potd_preview.json potd_backtest.json; do
            if [ -f "data/$f" ]; then git add "data/$f"; fi
          done
          git diff --cached --quiet || git commit -m "Back-test models $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
