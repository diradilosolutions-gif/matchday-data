name: Test upset signals
# Re-tests ONLY the Upset Pick signals on past seasons and updates the Upset Pick.
# It never changes the prediction model (data/model_choice.json), so it is safe during the tracking freeze.
# Run it from the Actions tab: "Test upset signals" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update           # never runs at the same time as the other workflows
  cancel-in-progress: false

jobs:
  test-upsets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download past seasons (football-data.co.uk, free)
        run: |
          mkdir -p hist
          for s in 2223 2324 2425 2526 2627; do
            for c in E0 E1 SP1 I1 D1 F1 N1 P1; do
              curl -sfL "https://www.football-data.co.uk/mmz4281/$s/$c.csv" -o "hist/${c}_$s.csv" || rm -f "hist/${c}_$s.csv"
            done
          done
          curl -sfL "https://www.football-data.co.uk/new/BRA.csv" -o hist/BRA_all.csv || rm -f hist/BRA_all.csv
          ls -la hist
      - name: Test which upset signals really work (stricter rules)
        run: python scripts/upset_backtest.py hist
      - name: Update the Upset Pick with the new results
        run: |
          if [ -f data/matches.json ]; then python scripts/pick_of_day.py; fi
      - name: Save results
        run: |
          git config user.name "matchday-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in upset_rules.json potd.json potd_preview.json potd_backtest.json; do
            if [ -f "data/$f" ]; then git add "data/$f"; fi
          done
          git diff --cached --quiet || git commit -m "Test upset signals $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
